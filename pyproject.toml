[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gfl2-packet-csv-exporter"
version = "1.5.0"
description = "Archived standalone GF2 packet-to-CSV backup/export utility"
requires-python = ">=3.11,<3.14"
dependencies = ["pydivert>=3.1.3,<4", "psutil>=6,<8", "PySide6-Essentials>=6.8,<7"]

[project.scripts]
gfl2-packet-csv = "gfl2_packet_csv.cli:main"
gfl2-packet-csv-gui = "gfl2_packet_csv.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
